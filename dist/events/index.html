<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="KCVA tournaments, showcases, and the moments that make a season.">
    <title>Events | KCVA</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/assets/js/i18n.js"></script>
    <script defer src="/assets/js/layout.js"></script>
  </head>
  <body data-title-key="nav.events">
    <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
    <div id="global-header"></div>

    <main id="main" tabindex="-1">
      <section class="page-hero">
        <div class="shell">
          <p class="eyebrow" data-i18n="events.eyebrow">KCVA EVENTS</p>
          <h1 data-i18n="events.title">On the court.</h1>
          <p data-i18n="events.body">
            Tournaments, showcases, and the moments that make a season.
          </p>
        </div>
      </section>

      <section class="events-index">
        <div class="shell">
          <div class="index-head">
            <h2 class="index-label" data-i18n="events.upcoming">Upcoming</h2>
            <span class="index-count" data-i18n="events.count">01 event</span>
          </div>

          <div class="event-index-grid">
            <article class="event-card">
              <a class="event-card-link" href="/events/volleywoods-25-26/">
                <div class="event-card-media">
                  <img
                    src="/assets/session-hero-image-D0C4Hexz.png"
                    alt=""
                    loading="lazy"
                    decoding="async"
                  >
                  <span class="status-pill" data-status="completed" data-i18n="event.status.completed">
                    COMPLETED
                  </span>
                </div>
                <div class="event-card-body">
                  <h3 data-i18n="home.latestTitle">KCVA Volleywoods | 25-26 Season</h3>
                  <p class="event-card-subtitle" data-i18n="home.latestSubtitle">
                    High School Volleyball Open Tournament
                  </p>
                  <div class="event-card-meta">
                    <span data-i18n="home.latestDate">Nov 14, 2026</span>
                    <span data-i18n="home.latestLocation">
                      Volleywood (TOP Central Park), Shanghai
                    </span>
                  </div>
                  <div class="event-card-footer">
                    <span data-i18n="events.viewEvent">View event</span>
                    <span class="event-card-arrow" aria-hidden="true">↗</span>
                  </div>
                </div>
              </a>
            </article>
          </div>
        </div>
      </section>
    </main>

    <div id="global-footer"></div>
  </body>
</html>
