<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="KCVA match replays, photo galleries, and stories from the season.">
    <title>Media Hub - Events | KCVA</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/assets/js/i18n.js"></script>
    <script defer src="/assets/js/layout.js"></script>
  </head>
  <body data-title-key="nav.mediaHub">
    <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
    <div id="global-header"></div>

    <main id="main" class="editorial-page" tabindex="-1">
      <section class="shell editorial-grid">
        <div class="editorial-copy">
          <p class="eyebrow" data-i18n="nav.mediaHub">Media Hub</p>
          <h1 data-i18n="media.title">Every rally. Every frame.</h1>
          <p class="editorial-body" data-i18n="media.body">
            Match replays, photo galleries, and the stories behind the season are on their way.
            In the meantime, the court is where you will find us.
          </p>
          <div class="editorial-actions">
            <a class="btn btn-solid" href="/events/" data-i18n="media.cta">See upcoming events</a>
          </div>
        </div>

        <div class="visual-panel" aria-hidden="true">
          <span class="visual-ring visual-ring--outer"></span>
          <span class="visual-ring visual-ring--inner"></span>
          <span class="visual-dot"></span>
          <span class="visual-watermark">ARCHIVE</span>
          <div class="visual-meta visual-meta--top">
            <span>KCVA</span>
            <span class="coming-soon" data-i18n="common.comingSoon">Coming soon</span>
          </div>
          <div class="visual-meta visual-meta--bottom">
            <span>25–26 Season</span>
            <span>Shanghai, CN</span>
          </div>
        </div>
      </section>
    </main>

    <div id="global-footer"></div>
  </body>
</html>
