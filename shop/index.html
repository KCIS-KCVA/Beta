<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="The official KCVA shop is coming soon.">
    <title>Shop | KCVA</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/assets/js/i18n.js"></script>
    <script defer src="/assets/js/layout.js"></script>
    <script defer src="/assets/js/cookies.js"></script>
  </head>
  <body data-page-title-key="title.shop">
    <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
    <div id="global-header"></div>

    <main id="main" tabindex="-1">
      <section class="page-hero shop-hero">
        <div class="shell">
          <p class="eyebrow" data-i18n="shop.eyebrow">KCVA SHOP</p>
          <h1 data-i18n="shop.title">Shop</h1>
          <p data-i18n="shop.body">
            Official KCVA gear, tournament collections, and campus essentials are on the way.
          </p>
        </div>
      </section>

      <section class="shop-coming" aria-labelledby="shop-coming-title">
        <div class="shell">
          <div class="shop-coming-content">
            <p class="shop-status" data-i18n="shop.status">COMING SOON</p>
            <h2 id="shop-coming-title" data-i18n="shop.messageTitle">
              The first collection is on its way.
            </h2>
            <p class="shop-message" data-i18n="shop.message">
              We are preparing the first KCVA collection. The shop will open here soon.
            </p>
            <a class="shop-coming-link" href="/events/">
              <span data-i18n="shop.eventsCta">Explore Events</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="global-footer"></div>
  </body>
</html>
